name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/casio_tool.py --help
      - run: python -m kits --help
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel without editable sources
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - name: Build synthetic images with installed package
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: python "${{ github.workspace }}/tests/test_casio_tool.py" BuildTests -v
      - name: Compile bundled firmware
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: python -c "from build_e5800p import load_project; fw = load_project(); linked = fw.link(); print(sum(len(block['data']) for block in linked['blocks']), 'compiled bytes')"
